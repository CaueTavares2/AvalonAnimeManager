name: Update Firestore on Commit

on:
  push:
    branches:
      - main

jobs:
  update-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update Firestore document
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ai-studio-0f1c0323-dd3f-49a3-be98-0c8592fe2a86
          GIT_SHA: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
          node -e "
          const {Firestore} = require('@google-cloud/firestore');
          const db = new Firestore({
            projectId: process.env.FIREBASE_PROJECT_ID,
            databaseId: process.env.FIREBASE_DATABASE_ID
          });
          db.doc('updates/latest').set({
            sha: process.env.GIT_SHA,
            message: process.env.GIT_MESSAGE,
            date: new Date().toISOString()
          }).then(() => {
            console.log('Firestore updated successfully');
            process.exit(0);
          }).catch((err) => {
            console.error('Error updating Firestore:', err);
            process.exit(1);
          });
          "