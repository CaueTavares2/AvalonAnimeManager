name: Update Firestore on Commit

on:
  push:
    branches:
      - main

jobs:
  update-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Firestore document
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ai-studio-0f1c0323-dd3f-49a3-be98-0c8592fe2a86
          GIT_SHA: ${{ github.sha }}
          GIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
          node -e "
          const crypto = require('crypto');
          const fs = require('fs');
          const sa = JSON.parse(fs.readFileSync('/tmp/service-account.json', 'utf8'));
          const now = Math.floor(Date.now() / 1000);
          const header = { alg: 'RS256', typ: 'JWT' };
          const payload = {
            iss: sa.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            exp: now + 3600,
            iat: now
          };
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const jwt = b64(header) + '.' + b64(payload);
          const sign = crypto.createSign('RSA-SHA256');
          sign.update(jwt);
          const sig = sign.sign(sa.private_key, 'base64url');
          const assertion = jwt + '.' + sig;
          fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=' + assertion
          }).then(r => r.json()).then(tok => {
            const acc = tok.access_token;
            const dbPath = 'projects/' + process.env.FIREBASE_PROJECT_ID + '/databases/' + process.env.FIREBASE_DATABASE_ID + '/documents/updates/latest';
            return fetch('https://firestore.googleapis.com/v1/' + dbPath, {
              method: 'PATCH',
              headers: {
                'Authorization': 'Bearer ' + acc,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                fields: {
                  sha: { stringValue: process.env.GIT_SHA },
                  message: { stringValue: process.env.GIT_MESSAGE },
                  date: { stringValue: new Date().toISOString() }
                }
              })
            });
          }).then(r => {
            if (!r.ok) return r.text().then(t => { throw new Error(t); });
            console.log('Firestore updated successfully');
            process.exit(0);
          }).catch(err => {
            console.error('Error updating Firestore:', err.message || err);
            process.exit(1);
          });
          "